name: kalady_kiosk
description: "A new Flutter project."

publish_to: "none" # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.7.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_screenutil: ^5.9.3
  # google_fonts: ^6.3.0
  http: ^1.4.0
  async: ^2.13.0
  fluttertoast: ^10.0.0
  shared_preferences: ^2.5.3
  provider: ^6.1.5
  intl: ^0.20.2
  razorpay_flutter: ^1.4.0
  flutter_thermal_printer: 1.2.1+1
  encrypt: ^5.0.3
  url_launcher: ^6.3.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: "^0.14.3"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/kalady_logo.jpg"

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/fonts/NotoSansMalayalam-Regular.ttf

  # fonts:
  #   - family: ShipporiAntiqueB1
